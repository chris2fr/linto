version: v0.1.0
groups:
  beta: default
  biblio: default
  launch: default
  linto:
    configdata:
      aliases:
        zz: "linto launch zed"
  quarto: default
  utils: default
  old:
    enable: false
shortcuts:
  prettyprint:
    group: utils
    command: prettyprint
  stripaccents:
    group: utils
    command: stripaccents
  slug:
    group: utils
    command: stripaccents
  guillemets2quotes:
    group: quarto
    command: guillemets2quotes
  zz:
    group: launch
    command: zed
