version: v0.1.0
groups:
  beta: default
  biblio: default
  launch: default
  linto:
    aliases:
      aliases:
        zz: "linto launch zed"
      unaliases:
        - something-to-delete-from-aliases
  quarto: default
  utils: default
  old:
    enable: false
shortcuts:
  prettyprint: "utils prettyprint"
  stripaccents: "utils stripaccents"
  slug: "utils stripaccents"
  guillemets2quotes: "quarto guillemets2quotes"

# markdown-viewer: md-tui
markdown-viewer:
  - md-tui
  - mdless
  - frogmouth
  - mdcat
  - mandown
  - glow
  - inlyne
  - bat
  - cat
  - mdfried
  - ghostwriter
  - marktext
  - zeditor
  - apostrophe
  - marknote
  - marker
  - md-reader
  - md-viewer
  - blink
