version: v0.1.0
groups:
  beta:
    shortcuts: false
  biblo:
    shortcuts: false
  launch: default
  linto:
    shortcuts: false
  quarto:
    shortcuts:
      - guillemets2quotes
  utils:
    shortcuts:
      - prettyprint
      - stripaccents
  old:
    enable: false
shortcuts:
  "prettyprint2": "utils prettyprint"
  "stripaccents2": "utils stripaccents"
  "guillemets2quotes2": "quarto guillemets2quotes"
quarto:
  extension: chris2fr/quarto
# markdown-viewer: md-tui
markdown-viewer:
  - md-tui
  - mdless
  - frogmouth
  - mdcat
  - mandown
  - glow
  - inlyne
  - bat
  - cat
  - mdfried
  - ghostwriter
  - marktext
  - zeditor
  - apostrophe
  - marknote
  - marker
  - md-reader
  - md-viewer
  - blink
