version: v0.1.0
groups:
  beta: default
  biblio: default
  launch: default
  linto: default
  quarto: default
  utils: default
  old:
    enable: false
shortcuts:
  prettyprint: "utils prettyprint"
  stripaccents: "utils stripaccents"
  slug: "utils stripaccents"
  guillemets2quotes: "quarto guillemets2quotes"
quarto:
  extension: chris2fr/quarto
# markdown-viewer: md-tui
markdown-viewer:
  - md-tui
  - mdless
  - frogmouth
  - mdcat
  - mandown
  - glow
  - inlyne
  - bat
  - cat
  - mdfried
  - ghostwriter
  - marktext
  - zeditor
  - apostrophe
  - marknote
  - marker
  - md-reader
  - md-viewer
  - blink
