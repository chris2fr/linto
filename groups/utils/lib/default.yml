configdata:
  # Hand `timer` and `countdown` over to tclock (clock-tui) when it is installed and
  # the output is a terminal. Set to false to always use Linto's own display.
  tclock: true
  qrdecode:
    # Decoders tried in order; the first one available is used.
    #   zbar    the zbarimg command (package zbar-tools): small, no Python packages
    #   opencv  the Python module cv2 (extra qr-opencv, about 150 MB, installed on first use)
    # Only zbar by default; add opencv ([zbar, opencv]) or use --backend opencv for the Python decoder.
    backends: [zbar]
