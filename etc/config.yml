# Linto installation defaults: the groups that are enabled and the shortcuts
# every user gets. `linto linto install --system` installs this file as the
# installed tree's config.yml, with the version of the checkout. Local changes
# belong in /etc/linto/linto.yml (system-wide) or ~/.linto.yml (per user), not here.
version: v0.1.0
groups:
  beta: default
  bib: default
  launch: default
  linto: default
  quarto: default
  utils: default
  web: default
  old:
    enable: false
shortcuts:
  prettyprint: "utils prettyprint"
  stripaccents: "utils stripaccents"
  slug: "utils stripaccents"
  guillemets2quotes: "quarto guillemets2quotes"
