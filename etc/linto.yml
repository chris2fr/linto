# Linto local configuration.
#
# This file is read on top of the installation's config.yml:
#   /etc/linto/linto.yml                      system-wide
#   ~/.linto.yml                              per user, above the system file
#   ~/.config/linto/config.yml                per user (XDG), above everything else
# Only the settings you change are needed. Run `linto linto config --effective`
# to see the merged result and `linto help config` for the full reference.
groups: {}
shortcuts: {}
